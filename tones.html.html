<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnamese Tones – Tap to Listen</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #ffffff;
  --surface: #f1f4f4;
  --text: #2a1f1a;
  --muted: #6f645e;
  --title: #3b2318;
  --vowel: #b5562c;
  --vowel-tint: #f6e3d8;
  --cons: #1f7a74;
  --cons-tint: #d5e9e6;
  --gold: #e2a62b;
  --on-color: #ffffff;
  --border: #d9dfdf;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1512; --surface: #272019; --text: #f3ece7; --muted: #b3a79f; --title: #f6e3d8;
    --vowel: #d2703f; --vowel-tint: #3a2418; --cons: #2fa39b; --cons-tint: #14312f;
    --gold: #e8b53f; --on-color: #14100d; --border: #3a322c;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1512; --surface: #272019; --text: #f3ece7; --muted: #b3a79f; --title: #f6e3d8;
  --vowel: #d2703f; --vowel-tint: #3a2418; --cons: #2fa39b; --cons-tint: #14312f;
  --gold: #e8b53f; --on-color: #14100d; --border: #3a322c;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: Calibri, "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  line-height: 1.4;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 22px 18px 40px; }
h1 { font-family: Cambria, Georgia, "Times New Roman", serif; color: var(--title); font-size: clamp(26px, 5vw, 38px); margin: 0 0 4px; line-height: 1.15; }
.vi { color: var(--muted); font-weight: 400; font-size: .55em; margin-left: 8px; white-space: nowrap; }
.sub { color: var(--muted); margin: 0 0 18px; font-size: 16px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.pills { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; cursor: pointer; }
.pill {
  border: 1.5px solid var(--border); background: var(--bg); color: var(--text);
  padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 15px; min-height: 40px;
}
.pill[aria-pressed="true"] { background: var(--title); color: var(--bg); border-color: var(--title); }
.pill.v[aria-pressed="true"] { background: var(--vowel); border-color: var(--vowel); color: var(--on-color); }
.pill.c[aria-pressed="true"] { background: var(--cons); border-color: var(--cons); color: var(--on-color); }
.spacer { flex: 1; }
.playall {
  border: 0; background: var(--gold); color: #2a1f1a; font-weight: 700; padding: 9px 18px;
  border-radius: 999px; min-height: 40px; font-size: 15px;
}
.legend { display: flex; flex-wrap: wrap; gap: 16px; color: var(--muted); font-size: 14px; margin: 0 0 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.dot.v { background: var(--vowel); } .dot.c { background: var(--cons); }
.dot.u { border: 3px solid var(--gold); background: var(--surface); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 10px; }
.tile {
  position: relative; border: 0; border-radius: 14px; min-height: 92px; padding: 8px 4px 6px;
  color: var(--on-color); font-family: Cambria, Georgia, "Times New Roman", serif; font-weight: 700;
  font-size: 30px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.tile.v { background: var(--vowel); } .tile.c { background: var(--cons); }
.tile.u { outline: 3.5px solid var(--gold); outline-offset: -3.5px; }
.tile:hover { transform: translateY(-2px); }
.tile:focus-visible, .pill:focus-visible, .playall:focus-visible, .big:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tile .spk { font-size: 13px; font-family: Calibri, "Segoe UI", system-ui, sans-serif; font-weight: 400; opacity: .85; }
.tile[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 6px var(--title); }
.tile.playing { animation: pulse .55s ease-in-out infinite alternate; }
@keyframes pulse { from { transform: scale(1); } to { transform: scale(1.08); } }
@media (prefers-reduced-motion: reduce) { .tile.playing { animation: none; filter: brightness(1.2); } .tile { transition: none; } }
.detail {
  margin: 0 0 18px; background: var(--surface); border-radius: 18px; padding: 16px;
  display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; min-height: 140px;
}
.big {
  border: 0; border-radius: 18px; width: 120px; height: 120px; color: var(--on-color); background: var(--vowel);
  font-family: Cambria, Georgia, "Times New Roman", serif; font-weight: 700; font-size: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.big.c { background: var(--cons); } .big small { font-family: Calibri, "Segoe UI", system-ui, sans-serif; font-weight: 600; font-size: 13px; margin-top: 2px; }
.info h2 { margin: 0 0 4px; font-family: Cambria, Georgia, serif; color: var(--title); font-size: 22px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; margin-right: 6px; }
.tag.v { background: var(--vowel-tint); color: var(--vowel); } .tag.c { background: var(--cons-tint); color: var(--cons); } .tag.u { background: var(--gold); color: #2a1f1a; }
.hint { font-size: 18px; margin: 8px 0 4px; }
.ex { color: var(--muted); font-size: 16px; margin: 0; }
.ex b { color: var(--vowel); font-size: 22px; font-family: Cambria, Georgia, serif; }
.empty { color: var(--muted); font-size: 18px; }
.note { color: var(--muted); font-size: 13px; margin-top: 22px; }
@media (max-width: 520px) { .detail { grid-template-columns: 1fr; justify-items: center; text-align: center; } .big { width: 104px; height: 104px; font-size: 46px; } }

.sec { font-family: Cambria, Georgia, "Times New Roman", serif; color: var(--title); font-size: clamp(22px, 4vw, 30px); margin: 34px 0 4px; line-height: 1.2; }
.tbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0 14px; }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.tcard { text-align: left; border: 0; background: var(--surface); color: var(--text); border-radius: 18px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 4px; transition: transform .12s ease; }
.tcard:hover { transform: translateY(-2px); }
.tcard:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tcard.playing { box-shadow: 0 0 0 3px var(--gold); }
.thead { display: flex; align-items: center; justify-content: space-between; }
.tname { font-family: Cambria, Georgia, serif; font-weight: 700; font-size: 28px; color: var(--title); }
.glyph { width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: #2a1f1a; display: inline-flex; align-items: center; justify-content: center; font-family: Cambria, Georgia, serif; font-weight: 700; font-size: 24px; }
.tmark { color: var(--muted); font-size: 14px; }
.tcard svg { width: 100%; height: auto; max-height: 110px; color: var(--vowel); margin: 4px 0; }
.tdesc { font-size: 16px; }
.tplay { margin-top: 4px; font-weight: 700; color: var(--cons); font-size: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vietnamese Tones <span class="vi">Thanh điệu</span></h1>
  <p class="sub">6 tones. Tap a card to hear it, then repeat out loud. The dot shows where your voice starts.</p>
  <div class="tbar"><button class="playall" id="playtones" type="button">▶ Play all tones</button></div>
  <div class="tgrid" id="tgrid"></div>
  <p class="note">Pitch shapes follow the Northern (Hanoi) accent and are approximate: the Southern accent merges hỏi and ngã. Always listen first. Recordings: your teacher.</p>
</div>

/* ---------- audio engine (Web Audio first, <audio> fallback) ---------- */
var ctx = null, buffers = {}, decoding = null, fallback = false;
function b64ToBytes(b64) {
  var bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function getCtx() {
  if (ctx || fallback) return ctx;

    var AC = window.AudioContext || window.webkitAudioContext;
    ctx = AC ? new AC() : null;
    if (!ctx) fallback = true;

}
function decodeBuf(bytes) {

function ensureDecoded() {

  }));

function setPlaying(letter, on) {

    stopCurrent();

function contourSvg(id) {

function stopTones() { playingTones = false; token++; stopCurrent(); tonesBtn.textContent = "▶ Play all tones"; }
function playAllTones() {
  if (playingTones) { stopTones(); return; }
  playingTones = true; var my = ++token;
  tonesBtn.textContent = "■ Stop";

    if (my !== token || i >= TONES.length) { if (my === token) stopTones(); return; }
    var id = "t-" + TONES[i++][0];
    tiles[id].scrollIntoView({ block: "nearest", behavior: "smooth" });
    play(id).then(function () { setTimeout(next, 800); });
  })();
}
